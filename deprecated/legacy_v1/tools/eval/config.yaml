# ─────────────────────────────────────────────
# 音频评估配置文件
# ─────────────────────────────────────────────

# 【必填】参考音频目录（干净/原始语音）
# 示例：请替换为实际的 clean 参考音频目录（或用命令行 --ref_dir 覆盖）
ref_dir: /path/to/clean_ref

# 【必填】待评估音频目录（处理后/降质语音）
# 示例：请替换为实际的待评估音频目录（或用命令行 --deg_dir 覆盖）
deg_dir: /path/to/deg

# 输出文件路径
output_csv:  results.csv      # 逐文件评估结果
output_json: summary.json     # 汇总统计（均值/标准差/最大/最小）

# ─────────────────────────────────────────────
# 评估指标选择
# 可选值: pesq, sisnr, stoi, visqol
# 注释掉不需要的指标
# ─────────────────────────────────────────────
metrics:
  - pesq
  - sisnr
  - stoi
  # - visqol

# ─────────────────────────────────────────────
# 文件配对方式
#   filename : 按文件名（不含扩展名）匹配（推荐）
#              ref/001.wav ↔ deg/001.wav
#   order    : 按排序顺序一一对应
#              ref 第1个文件 ↔ deg 第1个文件
# ─────────────────────────────────────────────
match_by: filename

# ─────────────────────────────────────────────
# PESQ 参数
#   pesq_sr: 8000  → narrowband (NB-PESQ)
#   pesq_sr: 16000 → wideband   (WB-PESQ)  ← 推荐
# ─────────────────────────────────────────────
pesq_sr: 16000

# ─────────────────────────────────────────────
# STOI 参数
#   stoi_extended: false → 标准 STOI
#   stoi_extended: true  → Extended STOI (ESTOI)，低 SNR 场景更准确
# ─────────────────────────────────────────────
stoi_extended: false

# ─────────────────────────────────────────────
# ViSQOL 参数
#   visqol_speech_mode: true  → speech 模式，16kHz，适合语音
#   visqol_speech_mode: false → audio  模式，48kHz，适合音乐/宽带音频
# ─────────────────────────────────────────────
visqol_speech_mode: true
