name: deploy-audio-demo

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static demo
        run: |
          mkdir -p _site/audioseal _site/voicemark
          cp demos/index.html _site/index.html
          cp demos/source_reference.wav _site/source_reference.wav
          cp demos/audioseal/*.wav _site/audioseal/
          cp demos/voicemark/*.wav _site/voicemark/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
