name: deploy-audio-demo

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static demo
        run: |
          mkdir -p _site
          cp demos/index.html _site/index.html
          cp demos/demo-data.js _site/demo-data.js
          cp demos/source_reference.wav demos/source_reference.mp3 _site/
          cp -r demos/conditions _site/conditions
          for model in audioseal wavmark timbrewm voicemark wmcodec; do
            cp -r "demos/${model}" "_site/${model}"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
